name: ci

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'bin/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'package.json'
      - 'packages/**'
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# The Rust toolchain version is pinned in rust-toolchain.toml (the single source
# of truth, also used by every developer's rustup). The jobs below install that
# same version so CI formatting/builds can't drift from local. Bump the version
# in rust-toolchain.toml and here together, in a commit that also reformats.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        # Fails the build on any unformatted file. Run `cargo fmt --all` locally
        # to fix; the pinned toolchain guarantees identical output here and there.
        run: cargo fmt --all --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --release
      - name: cargo test
        run: cargo test --release
      - name: launcher resolves binary
        # `wash mcp` reads MCP frames from stdin until EOF and exits 0 cleanly.
        # The integration test (`tests/mcp_stdio.rs`) drives the full protocol;
        # this is just a launcher-resolution smoke (asserts the Node-side bin/wash.mjs
        # finds and execs the Rust binary).
        run: |
          node bin/wash.mjs --version
          node bin/wash.mjs mcp <<< ''

  launcher-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate package layout
        run: |
          node -e "const p=require('./package.json');if(!p.bin?.wash)throw new Error('missing bin.wash');if(!p.optionalDependencies)throw new Error('missing optionalDependencies');console.log('wrapper ok')"
          for d in packages/wash-*; do
            node -e "const p=require('./$d/package.json');if(!p.os||!p.cpu)throw new Error('${d}: missing os/cpu');console.log('${d}: ok')"
          done
